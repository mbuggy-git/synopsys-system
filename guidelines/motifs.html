<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-core);background:var(--ink-1);color:var(--text-body)}a{color:var(--link)}a:hover{color:var(--link-hover)}</style></head><body style="padding:22px 28px;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;align-items:center;gap:14px"><span style="width:40px;height:2px;background:var(--grad-neon);border-radius:2px"></span><span style="font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--iris)">Gradient rule + eyebrow</span></div>
<div style="position:relative;height:70px;border-radius:12px;overflow:hidden;border:1px solid var(--line)">
<img src="../assets/imagery/coast-rear.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
<div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,10,30,.92) 0%,rgba(13,10,30,.55) 45%,rgba(13,10,30,0) 75%)"></div>
<div style="position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:700;color:#fff;letter-spacing:.04em">Protection gradient over imagery — text always on the dark side</div>
</div>
<div style="display:flex;gap:14px;align-items:center">
<span style="flex:1;height:2px;background:var(--grad-neon);border-radius:2px;box-shadow:0 0 12px rgba(0,129,254,.5)"></span>
<span style="width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)"></span>
<span style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">glow line + node dot — the "data stream" motif</span>
</div>
</body></html>
