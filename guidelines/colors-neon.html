<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-core);background:var(--ink-1)}a{color:var(--link)}a:hover{color:var(--link-hover)}.r{display:flex;height:170px;padding:16px;gap:12px;box-sizing:border-box}.s{flex:1;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;font-size:11px;color:#fff;letter-spacing:.06em}.n{font-weight:700;text-transform:uppercase}.h{opacity:.8;font-family:var(--font-mono);font-size:10px}</style></head><body>
<div class="r">
<div class="s" style="background:var(--iris);box-shadow:var(--glow-violet)"><span class="n">Iris</span><span class="h">#AC7BEA</span></div>
<div class="s" style="background:var(--cyan);box-shadow:var(--glow-cyan)"><span class="n">Synopsys Blue</span><span class="h">#0081FE</span></div>
<div class="s" style="background:var(--magenta)"><span class="n">Magenta</span><span class="h">#C84FF0</span></div>
<div class="s" style="background:var(--gold);color:#07050F"><span class="n">Gold</span><span class="h">#FFC94D</span></div>
</div></body></html>
