<!-- @dsCard group="Brand" viewport="700x170" name="Iconography on white" subtitle="Same tile system as dark: tinted fills, 1px matching borders, 1.25px strokes" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-core);background:#fff}a{color:var(--syn-purple)}a:hover{color:var(--syn-purple-light)}.t{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center}.t svg{width:26px;height:26px}</style></head><body style="padding:24px 28px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">
<script>
const names=['cpu','camera','circuit-board','code','monitor','brain-circuit','clipboard-check','shield-check','gauge','car','cloud-upload','lock','settings','radio-tower','route','refresh-cw'];
const tones=[['#fff','#6B3597'],['#fff','#006FDB'],['#fff','#FDB71A']];
names.forEach((n,k)=>{
  const [bg,c]=tones[k%3];
  const el=document.createElement('span');el.className='t';el.style.background=bg;el.style.color=c;el.style.border='1px solid '+c+'55';
  document.body.appendChild(el);
  fetch('../assets/icons/'+n+'.svg').then(r=>r.text()).then(t=>{el.innerHTML=t;});
});
</script>
</body></html>
