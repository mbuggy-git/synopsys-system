<!-- @dsCard group="Spacing" viewport="700x190" name="Radii & elevation" subtitle="Corner radii + card shadows and glows" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-core);background:var(--ink-1);color:var(--text-body)}a{color:var(--link)}a:hover{color:var(--link-hover)}.b{width:88px;height:88px;background:var(--surface-card);border:1px solid var(--line);display:flex;align-items:flex-end;padding:8px;box-sizing:border-box}.t{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}</style></head><body style="padding:28px 32px;display:flex;gap:18px;align-items:center">
<div class="b" style="border-radius:var(--r-sm)"><span class="t">r-sm 8</span></div>
<div class="b" style="border-radius:var(--r-md)"><span class="t">r-md 12</span></div>
<div class="b" style="border-radius:var(--r-lg);box-shadow:var(--shadow-card)"><span class="t">r-lg 16</span></div>
<div class="b" style="border-radius:var(--r-xl);box-shadow:var(--glow-violet)"><span class="t">r-xl 24</span></div>
<div style="width:130px;height:44px;border-radius:var(--r-pill);background:var(--grad-brand);box-shadow:var(--glow-violet);display:flex;align-items:center;justify-content:center"><span class="t" style="color:#fff">r-pill</span></div>
</body></html>
