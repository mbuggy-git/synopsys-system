<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-core)}a{color:var(--link)}a:hover{color:var(--link-hover)}</style></head><body>
<div data-screen-label="Quote spread" style="display:flex;width:1280px;height:720px;background:var(--ink-1)">
<div style="width:42%;position:relative;overflow:hidden">
<img src="../assets/imagery/tunnel-side.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
<div style="position:absolute;inset:0;background:linear-gradient(270deg,var(--ink-1) 0%,rgba(13,10,30,0) 45%)"></div>
<div style="position:absolute;left:32px;bottom:28px;font-size:11px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:rgba(232,230,244,.8)">A more connected world</div>
</div>
<div style="flex:1;box-sizing:border-box;padding:110px 88px;display:flex;flex-direction:column;justify-content:center">
<div style="font-size:64px;line-height:.6;font-weight:900;background:var(--grad-neon);-webkit-background-clip:text;background-clip:text;color:transparent">“</div>

</div>
