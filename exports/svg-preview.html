<!DOCTYPE html><html><head><style>body{margin:0;background:#26232E;display:flex;flex-direction:column;gap:24px;padding:24px}.w{width:100%;max-width:1280px;aspect-ratio:1.6;border:1px solid #444;overflow:hidden;position:relative}.w object{position:absolute;left:0;top:0;width:1600px;height:1000px;transform-origin:0 0;transform:scale(var(--k))}</style></head><body>
<div class="w"><object data="sdv-overview-a.svg" type="image/svg+xml"></object></div>
<div class="w"><object data="sdv-overview-b.svg" type="image/svg+xml"></object></div>
<div class="w"><object data="sdv-overview-c3.svg" type="image/svg+xml"></object></div>
<script>function fit(){document.querySelectorAll('.w').forEach(function(w){w.style.setProperty('--k', w.clientWidth/1600);});}addEventListener('resize',fit);fit();</script>
</body></html>
